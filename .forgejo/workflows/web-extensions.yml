# Builds the web extensions an OpenCloud server wants and deploys them there. Meant for the
# Forgejo mirror of this repository: a mirror sync triggers the push event.
#
#   1. read OC_WEB_APPS from the server's .env over ssh (deploy-built-apps.sh --list)
#   2. build exactly these apps from this checkout (build-web-extensions.sh, natively)
#   3. deploy-built-apps.sh --restart: upload them plus OC_EXTERNAL_WEB_APPS of the
#      server, swap them into OC_APPS_DIR and restart OpenCloud
#
# Repository settings (Actions):
#   variables  OC_DEPLOY_HOST         ssh target, e.g. deploy@oc.example.com
#              OC_DEPLOY_KNOWN_HOSTS  host key line(s): ssh-keyscan -t ed25519 <server>
#              OC_DEPLOY_DIR          compose checkout on the server (default /opt/opencloud-compose)
#              OC_DEPLOY_PORT         ssh port (default 22)
#   secrets    DEPLOY_SSH_KEY         private key whose public key is in the server's authorized_keys
#              PACKAGES_TOKEN         Forgejo token: read:package for OC_EXTERNAL_WEB_APPS downloads,
#                                     read:repository for the private webapp-lsm6 (or REPO_READ_TOKEN)

name: Web extensions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: linux-amd64
    container:
      # Fully qualified: Podman does not resolve short names to docker.io everywhere.
      image: docker.io/library/node:24-bookworm
    defaults:
      run:
        shell: bash
    env:
      # No Docker inside the job container - build directly in it.
      OC_BUILD_NATIVE: "true"
      OC_DEPLOY_HOST: ${{ vars.OC_DEPLOY_HOST }}
      OC_DEPLOY_DIR: ${{ vars.OC_DEPLOY_DIR || '/opt/opencloud-compose' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq jq rsync openssh-client
          npm install -g --no-audit --no-fund pnpm@11.9.0
          node --version && pnpm --version

      - name: Set up ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.OC_DEPLOY_KNOWN_HOSTS }}
          PORT: ${{ vars.OC_DEPLOY_PORT || '22' }}
        run: |
          missing=""
          [ -n "${OC_DEPLOY_HOST}" ] || missing+=" variable OC_DEPLOY_HOST"
          [ -n "${KNOWN_HOSTS}" ] || missing+=" variable OC_DEPLOY_KNOWN_HOSTS"
          [ -n "${DEPLOY_SSH_KEY}" ] || missing+=" secret DEPLOY_SSH_KEY"
          if [ -n "${missing}" ]; then
            echo "Missing repository settings:${missing}" >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          printf '%s\n' "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host *
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            Port ${PORT}
            BatchMode yes
            StrictHostKeyChecking yes
          EOF
          ssh "${OC_DEPLOY_HOST}" true
          echo "ssh to ${OC_DEPLOY_HOST} works."

      - name: Read app list from the server
        run: |
          apps="$(web-app-submodules/deploy-built-apps.sh --list "${OC_DEPLOY_HOST}" | paste -sd, -)"
          echo "Apps to build for ${OC_DEPLOY_HOST}: ${apps:-(none, only external apps)}"
          echo "BUILD_APPS=${apps}" >> "${GITHUB_ENV}"

      - name: Fetch submodules
        env:
          REPO_TOKEN: ${{ secrets.REPO_READ_TOKEN || secrets.PACKAGES_TOKEN }}
        run: |
          export GIT_TERMINAL_PROMPT=0
          lsm6="web-app-submodules/webapp-lsm6"
          # The protronic GitHub submodules use SSH URLs; they are public over HTTPS.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          mapfile -t paths < <(git config -f .gitmodules --get-regexp '\.path$' \
            | awk '{print $2}' | grep -vx "${lsm6}")
          git submodule update --init --recursive -- "${paths[@]}"

          # webapp-lsm6: private repository on this Forgejo (ssh://git@forgejo/... in
          # .gitmodules), only fetched when the server wants it.
          if [[ ",${BUILD_APPS}," == *",webapp-lsm6,"* ]]; then
            if [ -z "${REPO_TOKEN}" ]; then
              echo "The server wants webapp-lsm6 but there is no token with read:repository." >&2
              exit 1
            fi
            git config --global \
              url."${GITHUB_SERVER_URL/:\/\//://oauth2:${REPO_TOKEN}@}/".insteadOf "ssh://git@forgejo/"
            git submodule update --init -- "${lsm6}"
          fi
          git submodule status

      - name: Build
        run: |
          export OC_APPS_DIR="${PWD}/dist-apps"
          mkdir -p "${OC_APPS_DIR}"
          if [ -n "${BUILD_APPS}" ]; then
            # shellcheck disable=SC2086
            web-app-submodules/build-web-extensions.sh ${BUILD_APPS//,/ }
          fi

      - uses: actions/upload-artifact@v3
        with:
          name: web-apps
          path: dist-apps/

      - name: Deploy and restart OpenCloud
        env:
          # Downloads of OC_EXTERNAL_WEB_APPS (e.g. from the package registry).
          OC_EXTERNAL_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          export OC_APPS_DIR="${PWD}/dist-apps"
          web-app-submodules/deploy-built-apps.sh --restart "${OC_DEPLOY_HOST}"
